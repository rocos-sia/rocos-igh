<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rocos_igh 共享内存观察器</title>
<style>
  :root {
    --bg: #0f1620;
    --panel: #182230;
    --panel2: #1f2c3c;
    --border: #2a3a4d;
    --text: #d8e2ec;
    --muted: #8aa0b4;
    --accent: #4fc3f7;
    --ok: #4caf50;
    --warn: #ffb74d;
    --bad: #ef5350;
    --input: #4dd0e1;
    --output: #ffb74d;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  h1 { font-size: 20px; margin: 0 0 4px; font-weight: 600; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
  .sub code { background: var(--panel2); padding: 2px 6px; border-radius: 4px; font-size: 12px; }

  .status-bar {
    display: flex; align-items: center; gap: 10px; margin-bottom: 18px;
    padding: 8px 12px; border-radius: 8px; font-size: 13px;
    background: var(--panel); border: 1px solid var(--border);
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
  .dot.live { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
  .dot.waiting { background: var(--warn); }
  .dot.offline { background: var(--bad); }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px;
  }
  .card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  .kv { display: flex; justify-content: space-between; align-items: baseline; margin: 6px 0; }
  .kv .k { color: var(--muted); font-size: 13px; }
  .kv .v { font-family: var(--mono); font-size: 15px; }
  .state-badge {
    display: inline-block; padding: 2px 10px; border-radius: 6px; font-family: var(--mono);
    font-size: 13px; font-weight: 600; background: var(--panel2); border: 1px solid var(--border);
  }
  .state-OP { color: var(--ok); border-color: var(--ok); }
  .state-SAFEOP { color: var(--warn); border-color: var(--warn); }
  .state-INIT, .state-PREOP, .state-BOOTSTRAP { color: var(--muted); }

  .slave-box { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 16px; overflow: hidden; }
  .slave-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px; background: var(--panel2); border-bottom: 1px solid var(--border);
  }
  .slave-head .name { font-weight: 600; font-size: 14px; }
  .slave-head .meta { color: var(--muted); font-size: 12px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-size: 12px; font-weight: 500; background: var(--bg); position: sticky; top: 0; }
  td.mono { font-family: var(--mono); }
  td.bytes { font-family: var(--mono); font-size: 12px; color: var(--accent); }
  .tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 4px; }
  .tag.in  { background: rgba(77,208,225,.15); color: var(--input); }
  .tag.out { background: rgba(255,183,77,.15); color: var(--output); }
  tr.hint td { color: var(--muted); font-style: italic; text-align: center; }

  .empty { color: var(--muted); text-align: center; padding: 30px; font-size: 14px; }

  footer { margin-top: 20px; color: var(--muted); font-size: 12px; }
  footer code { background: var(--panel2); padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
<h1>rocos_igh 共享内存观察器</h1>
<div class="sub">观察 <code>ecm{id}</code> / <code>pd_input{id}</code> / <code>pd_output{id}</code> 实时数据</div>

<div class="status-bar">
  <span class="dot" id="dot"></span>
  <span id="statustext">连接中…</span>
</div>

<div class="grid">
  <div class="card">
    <h2>总线状态</h2>
    <div class="kv"><span class="k">当前状态</span><span class="v"><span class="state-badge" id="state">—</span></span></div>
    <div class="kv"><span class="k">请求状态</span><span class="v" id="reqstate">—</span></div>
    <div class="kv"><span class="k">已授权</span><span class="v" id="auth">—</span></div>
    <div class="kv"><span class="k">从站数</span><span class="v" id="slavenum">—</span></div>
  </div>
  <div class="card">
    <h2>控制周期</h2>
    <div class="kv"><span class="k">dt (μs)</span><span class="v" id="dt">—</span></div>
    <div class="kv"><span class="k">当前 (μs)</span><span class="v" id="cur">—</span></div>
    <div class="kv"><span class="k">最小 (μs)</span><span class="v" id="min">—</span></div>
    <div class="kv"><span class="k">最大 (μs)</span><span class="v" id="max">—</span></div>
    <div class="kv"><span class="k">平均 (μs)</span><span class="v" id="avg">—</span></div>
  </div>
  <div class="card">
    <h2>时间戳</h2>
    <div class="kv"><span class="k">timestamp (μs)</span><span class="v" id="ts">—</span></div>
    <div class="kv"><span class="k">模式</span><span class="v" id="mode">—</span></div>
    <div class="kv"><span class="k">重启统计</span><span class="v" id="reset">—</span></div>
  </div>
</div>

<div id="slaves">
  <div class="empty" id="loading">等待共享内存数据…</div>
</div>

<footer>
  数据来源：<code>/dev/shm/ecm{master_id}</code> + <code>pd_input{master_id}</code> + <code>pd_output{master_id}</code> · 刷新间隔约 250 ms
</footer>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const fmt = n => (typeof n === 'number' && isFinite(n)) ? n.toLocaleString() : '—';
  const hex2 = n => '0x' + n.toString(16).toUpperCase().padStart(2, '0');

  // 把字节序列渲染成可读的十六进制与（可能的）整数。
  function renderBytes(bytes, size) {
    const b = bytes.match(/../g) || [];
    if (!b.length) return '-';
    let hex = b.map(x => x.toUpperCase()).join(' ');
    let val = '';
    if (size === 1) val = parseInt(b[0], 16);
    else if (size === 2) val = parseInt(b[1] + b[0], 16);           // 小端 u16
    else if (size === 4) val = parseInt(b[3] + b[2] + b[1] + b[0], 16); // 小端 u32
    const show = (val !== '') ? ` = ${val}` : '';
    return `${hex}${show}`;
  }

  function setText(id, txt) { $(id).textContent = txt; }

  function renderBus(bus) {
    const s = bus.current_state_name || '?';
    const badge = $('state');
    badge.textContent = s;
    badge.className = 'state-badge state-' + s;
    setText('reqstate', bus.request_state);
    setText('auth', bus.is_authorized ? '是' : '否');
    setText('slavenum', bus.slave_num);
    setText('dt', fmt(bus.dt));
    setText('cur', fmt(bus.cycle.current));
    setText('min', fmt(bus.cycle.min));
    setText('max', fmt(bus.cycle.max));
    setText('avg', fmt(bus.cycle.avg));
    setText('ts', fmt(bus.timestamp));
    setText('mode', bus.demo ? '演示 (demo)' : '真实');
    setText('reset', bus.resetCycleTime ? '已请求' : '否');
  }

  function renderSlaves(bus) {
    const container = $('slaves');
    if (!bus.slave_num) {
      container.innerHTML = '<div class="empty">共享内存可达，但 0 个从站（可能是空配置）。</div>';
      return;
    }
    let html = '';
    for (const slave of bus.slaves) {
      html += `<div class="slave-box">
        <div class="slave-head">
          <span class="name">#${slave.id} ${slave.name}</span>
          <span class="meta">输入 ${slave.input_var_num} · 输出 ${slave.output_var_num}</span>
        </div>
        <table>
          <thead><tr><th>方向</th><th>变量名</th><th>Index</th><th>偏移</th><th>大小</th><th>实时值</th></tr></thead>
          <tbody>`;
      for (const v of slave.output_vars) {
        html += `<tr>
          <td><span class="tag out">OUT</span></td>
          <td>${v.name}</td>
          <td class="mono">${v.index}.${v.sub_index}</td>
          <td class="mono">${v.offset}</td>
          <td class="mono">${v.size} B</td>
          <td class="bytes">${renderBytes(v.bytes, v.size)}</td>
        </tr>`;
      }
      for (const v of slave.input_vars) {
        html += `<tr>
          <td><span class="tag in">IN</span></td>
          <td>${v.name}</td>
          <td class="mono">${v.index}.${v.sub_index}</td>
          <td class="mono">${v.offset}</td>
          <td class="mono">${v.size} B</td>
          <td class="bytes">${renderBytes(v.bytes, v.size)}</td>
        </tr>`;
      }
      html += '</tbody></table></div>';
    }
    container.innerHTML = html;
  }

  function updateStatus(connected, demo, error) {
    const dot = $('dot');
    const txt = $('statustext');
    if (connected) {
      dot.className = 'dot live';
      txt.textContent = demo
        ? '已连接（演示模式）· 数据为模拟值'
        : '已连接 · 实时';
    } else {
      dot.className = 'dot waiting';
      txt.textContent = error
        ? '未连接到共享内存：' + error
        : '等待共享内存出现…（需先运行 rocos_igh_master）';
    }
  }

  function handle(snapshot) {
    if (!snapshot.available) {
      $('slaves').innerHTML = '<div class="empty">' + (snapshot.error || '共享内存不可用') + '</div>';
      updateStatus(false, snapshot.demo, snapshot.error);
      // 清空卡片。
      ['state','reqstate','auth','slavenum','dt','cur','min','max','avg','ts','mode','reset'].forEach(k => setText(k, '—'));
      return;
    }
    updateStatus(true, snapshot.demo);
    renderBus(snapshot);
    renderSlaves(snapshot);
  }

  // 优先用 SSE 实时流；不支持时退回定时轮询 /api/snapshot。
  const useSSE = ('EventSource' in window) && (window.EventSource !== undefined);
  if (useSSE) {
    const es = new EventSource('/api/events');
    es.onmessage = e => {
      try { handle(JSON.parse(e.data)); } catch (_) {}
    };
    es.onerror = () => {
      // EventSource 会自动重连；切换为等待状态。
      $('dot').className = 'dot waiting';
      $('statustext').textContent = '连接中断，重连中…';
    };
  } else {
    const poll = () => fetch('/api/snapshot').then(r => r.json()).then(handle).catch(() => {
      updateStatus(false, false, '无法连接服务器');
    });
    poll();
    setInterval(poll, 500);
  }
})();
</script>
</body>
</html>
